<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>おととことば｜ことばたんけん</title><style>
*{box-sizing:border-box}body{margin:0;background:#285345;color:#254336;font-family:"Hiragino Maru Gothic ProN","Yu Gothic",sans-serif;font-weight:700}main{max-width:590px;margin:auto;padding:12px}a{color:inherit}.back{color:white;display:inline-block;padding:8px 0;text-decoration:none}h1{color:#fff9e8;text-align:center;margin:4px 0 10px;font-size:clamp(24px,6vw,32px)}.panel{background:#fffdf4;border-radius:22px;padding:14px;box-shadow:0 5px #1b3e32}.top{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}.top label{font-size:14px}select,button{font:inherit;touch-action:manipulation}select{padding:9px;border:2px solid #c9d9c6;border-radius:12px;max-width:100%;background:white;color:#254336}.stats{font-size:15px;color:#377b59}.instructions{text-align:center;margin:10px 0;font-size:15px}.board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px}.tile{aspect-ratio:1;min-height:64px;min-width:0;border:2px solid #cddfc8;border-bottom-width:5px;background:#eef6ff;border-radius:15px;color:#244737;display:grid;place-items:center;padding:4px;cursor:pointer}.tile.word{background:#fff2df;border-color:#ead4b6}.tile.covered{background:#4c927b;border-color:#2d6d59;color:#fff8dc}.tile.covered .backmark{font-size:clamp(28px,8vw,43px)}.tile.revealed{animation:turn .22s ease-out}@keyframes turn{from{transform:scaleX(.15)}to{transform:scaleX(1)}}.tile.selected{outline:4px solid #e9ad39;outline-offset:-3px;background:#fff1b8}.tile.done{background:#dcefe1;border-color:#9ecbab;opacity:.55}.tile .emoji{font-size:clamp(29px,8vw,45px);line-height:1}.tile .wordtext{font-size:clamp(14px,4vw,21px);overflow-wrap:anywhere}.tile:focus-visible,button:focus-visible,select:focus-visible{outline:3px solid #d88d18;outline-offset:2px}.controls{display:flex;justify-content:center;gap:8px;margin:12px 0 0;flex-wrap:wrap}.controls button{border:0;border-radius:12px;padding:11px 15px;background:#dcefc9;color:#254336}.message{min-height:25px;text-align:center;margin:10px 0 0}.audio-status{margin:8px 0 0;text-align:center;font-size:14px}.audio-status:empty{display:none}.note{font-size:12px;line-height:1.65;color:#697e70;margin:12px 0 0}@media(max-width:380px){main{padding:7px}.panel{padding:9px}.board{gap:5px}.tile{border-radius:11px;min-height:60px}.tile .wordtext{font-size:14px}}@media(orientation:landscape){main{max-width:650px}.tile{aspect-ratio:1.4}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style></head><body><main><a class="back" href="./#tanken-list">← ことばたんけん に もどる</a><h1>🔊 おととことば</h1><section class="panel"><div class="top"><label>しゅるいを えらぼう <select id="category"></select></label><span class="stats" id="count">0 / 8 くみ</span></div><p class="instructions">うらがえしの かーどを 2まい めくろう</p><div class="board" id="board" aria-label="えとことばのカード16まい"></div><p class="message" id="message" role="status" aria-live="polite"></p><div class="controls"><button id="replay">🔊 もういちど きく</button><button id="again">🔄 もういちど</button></div><p id="audioStatus" class="audio-status" role="status"></p>
<p class="note">カードを めくると、その おとが なります。</p>
<details class="note"><summary>音源の出典・クレジット</summary>
<p>原田英語「英語の先生の玉手箱」の配布音源を使用しています。<a href="https://github.com/kagoya/kotobagame/blob/main/assets/sounds/CREDITS.md">録音者・出典・ライセンスの一覧</a></p>
</details></section></main><script>
const DATA={
"どうぶつ":[["🐶","いぬ","わん わん","dog.mp3"],["🐱","ねこ","にゃあ にゃあ","cat.mp3"],["🐮","うし","もー","cow.mp3"],["🐸","かえる","けろ けろ","frog.mp3"],["🐔","にわとり","こけこっこー","rooster.mp3"],["🐦","とり","ちゅん ちゅん","bird.mp3"],["🐴","うま","ひひーん","horse.mp3"],["🐑","ひつじ","めえ めえ","sheep.mp3"]],
"のりもの":[["🚂","きしゃ","しゅっ しゅっ","steam-train.mp3"],["🚗","くるま","ぶーん","car.mp3"],["🚑","きゅうきゅうしゃ","ぴーぽー","ambulance.mp3"],["🚓","ぱとかー","うー うー","police-car.mp3"],["🏍️","ばいく","ぶるるん","motorcycle.mp3"],["🚁","へりこぷたー","ばらばら","helicopter.mp3"],["🚲","じてんしゃ","ちりん ちりん","bicycle.mp3"],["🚢","ふね","ぼー","ship.mp3"]],
"しぜん":[["🌧️","あめ","ざあ ざあ","rain.mp3"],["⚡","かみなり","どかーん","thunder.mp3"],["🌬️","かぜ","びゅう びゅう","wind.mp3"],["🌊","なみ","ざぶーん","waves.mp3"],["💧","しずく","ぽちゃん","water-drop.mp3"],["🍃","はっぱ","かさ かさ","leaves.mp3"],["🔥","ひ","ぱち ぱち","fire.mp3"],["🏞️","かわ","さら さら","stream.mp3"]],
"おうち":[["⏰","とけい","ちく たく","clock.mp3"],["🚪","どあ","ぎい","door.mp3"],["🔔","ちゃいむ","ぴん ぽーん","doorbell.mp3"],["🚰","すいどう","じゃあ","tap.mp3"],["✂️","はさみ","ちょき ちょき","scissors.mp3"],["🧹","そうじき","ぶおーん","vacuum.mp3"],["📞","でんわ","りん りん","phone.mp3"],["🍳","ふらいぱん","じゅう じゅう","frying.mp3"]],
"がっき":[["🥁","たいこ","どん どん","taiko.mp3"],["🔔","すず","しゃん しゃん","bells.mp3"],["🎹","ぴあの","ぽろん","piano.mp3"],["🎸","ぎたー","じゃらん","guitar.mp3"],["🎺","らっぱ","ぱぱぱ","trumpet.mp3"],["🪇","まらかす","しゃか しゃか","maracas.mp3"],["🪘","ぼんご","とん とん","bongo.mp3"],["🎻","ばいおりん","きい きい","violin.mp3"]]};
const $=id=>document.getElementById(id),categories=Object.keys(DATA);let cards=[],chosen=null,done=new Set(),lastSound="",locked=false,wrongTimer=null;const sel=$("category");categories.forEach(c=>{let o=document.createElement("option");o.value=c;o.textContent=c;sel.append(o)});
let currentAudio = null, lastPlayedIndex = null;

function stopEffect() {
  if (currentAudio) currentAudio.pause();
  currentAudio = null;
  $("audioStatus").textContent = "";
}

async function playEffect(i) {
  stopEffect();
  lastPlayedIndex = i;
  const [, , , filename] = DATA[sel.value][i];
  if (!filename) {
    $("audioStatus").textContent = "この おとは まだ ありません";
    return;
  }
  const audio = new Audio("./assets/sounds/" + filename);
  currentAudio = audio;
  try {
    await audio.play();
  } catch {
    if (currentAudio === audio) $("audioStatus").textContent = "おとを さいせいできませんでした";
  }
}
function shuffle(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function start(){stopEffect();lastPlayedIndex=null;if(wrongTimer)clearTimeout(wrongTimer);wrongTimer=null;locked=false;done=new Set();chosen=null;lastSound="";$("message").textContent="";cards=shuffle(DATA[sel.value].flatMap((p,i)=>[{i,type:"picture",label:p[0]},{i,type:"word",label:p[1]}]));render()}
function render(){const board=$("board");board.replaceChildren();$("count").textContent=done.size+" / 8 くみ";cards.forEach((c,n)=>{const visible=done.has(c.i)||chosen===n||locked&&secondChoice===n;const b=document.createElement("button");b.type="button";b.className="tile "+(visible?(c.type==="word"?"word ":"")+"revealed ":"covered ")+(done.has(c.i)?"done ":"")+(chosen===n?"selected":"");b.disabled=done.has(c.i)||locked;b.setAttribute("aria-label",done.has(c.i)?"そろった "+(c.type==="picture"?"え ":"ことば ")+c.label:visible?(c.type==="picture"?"え ":"ことば ")+c.label:"うらがえしのカード "+(n+1));b.setAttribute("aria-pressed",visible?"true":"false");const span=document.createElement("span");span.className=visible?(c.type==="picture"?"emoji":"wordtext"):"backmark";span.textContent=visible?c.label:"？";b.append(span);b.addEventListener("click",()=>choose(n));board.append(b)})}
let secondChoice=null;
function choose(n){if(locked)return;const c=cards[n];if(done.has(c.i))return;playEffect(c.i);if(chosen===n){return}if(chosen===null){chosen=n;$("message").textContent="もう いちまい めくってね";render();return}const first=cards[chosen];secondChoice=n;locked=true;render();if(first.i===c.i&&first.type!==c.type){$("message").textContent="せいかい！ "+DATA[sel.value][c.i][2];lastSound=DATA[sel.value][c.i][2];wrongTimer=setTimeout(()=>{done.add(c.i);chosen=null;secondChoice=null;locked=false;wrongTimer=null;render();if(done.size===8)$("message").textContent="🎉 ぜんぶ できた！ はなまる！"},650)}else{$("message").textContent="ちがったね。もういちど！";wrongTimer=setTimeout(()=>{chosen=null;secondChoice=null;locked=false;wrongTimer=null;render();$("message").textContent="つぎの かーどを めくろう"},1100)}}
sel.addEventListener("change",start);$("again").addEventListener("click",start);$("replay").addEventListener("click",()=>{if(lastPlayedIndex!==null)playEffect(lastPlayedIndex);else $("message").textContent="まず え と ことばを そろえてね"});start();
</script></body></html>
