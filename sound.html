<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>おととことば｜ことばたんけん</title><style>
*{box-sizing:border-box}body{margin:0;background:#285345;color:#254336;font-family:"Hiragino Maru Gothic ProN","Yu Gothic",sans-serif;font-weight:700}main{max-width:590px;margin:auto;padding:12px}a{color:inherit}.back{color:white;display:inline-block;padding:8px 0;text-decoration:none}h1{color:#fff9e8;text-align:center;margin:4px 0 10px;font-size:clamp(24px,6vw,32px)}.panel{background:#fffdf4;border-radius:22px;padding:14px;box-shadow:0 5px #1b3e32}.top{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}.top label{font-size:14px}select,button{font:inherit;touch-action:manipulation}select{padding:9px;border:2px solid #c9d9c6;border-radius:12px;max-width:100%;background:white;color:#254336}.stats{font-size:15px;color:#377b59}.instructions{text-align:center;margin:10px 0;font-size:15px}.board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px}.tile{aspect-ratio:1;min-height:64px;min-width:0;border:2px solid #cddfc8;border-bottom-width:5px;background:#eef6ff;border-radius:15px;color:#244737;display:grid;place-items:center;padding:4px;cursor:pointer}.tile.word{background:#fff2df;border-color:#ead4b6}.tile.selected{outline:4px solid #e9ad39;outline-offset:-3px;background:#fff1b8}.tile.done{background:#dcefe1;border-color:#9ecbab;opacity:.55}.tile .emoji{font-size:clamp(29px,8vw,45px);line-height:1}.tile .wordtext{font-size:clamp(14px,4vw,21px);overflow-wrap:anywhere}.tile:focus-visible,button:focus-visible,select:focus-visible{outline:3px solid #d88d18;outline-offset:2px}.controls{display:flex;justify-content:center;gap:8px;margin:12px 0 0;flex-wrap:wrap}.controls button{border:0;border-radius:12px;padding:11px 15px;background:#dcefc9;color:#254336}.message{min-height:25px;text-align:center;margin:10px 0 0}.note{font-size:12px;line-height:1.65;color:#697e70;margin:12px 0 0}@media(max-width:380px){main{padding:7px}.panel{padding:9px}.board{gap:5px}.tile{border-radius:11px;min-height:60px}.tile .wordtext{font-size:14px}}@media(orientation:landscape){main{max-width:650px}.tile{aspect-ratio:1.4}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style></head><body><main><a class="back" href="./#tanken-list">← ことばたんけん に もどる</a><h1>🔊 おととことば</h1><section class="panel"><div class="top"><label>しゅるいを えらぼう <select id="category"></select></label><span class="stats" id="count">0 / 8 くみ</span></div><p class="instructions">え と ことばを ひとつずつ えらんでね</p><div class="board" id="board" aria-label="えとことばのカード16まい"></div><p class="message" id="message" role="status" aria-live="polite"></p><div class="controls"><button id="replay">🔊 おとを きく</button><button id="again">🔄 もういちど</button></div><p class="note">カードがそろうと、関連する音の言葉を読み上げます。現段階では実際の録音ではなく、音を表す言葉の音声読み上げです。端末の音量を確認してください。</p></section></main><script>
const DATA={
"どうぶつ":[["🐶","いぬ","わん わん"],["🐱","ねこ","にゃあ にゃあ"],["🐮","うし","もー"],["🐸","かえる","けろ けろ"],["🐔","にわとり","こけこっこー"],["🐦","とり","ちゅん ちゅん"],["🐴","うま","ひひーん"],["🐑","ひつじ","めえ めえ"]],
"のりもの":[["🚂","きしゃ","しゅっ しゅっ"],["🚗","くるま","ぶーん"],["🚑","きゅうきゅうしゃ","ぴーぽー"],["🚓","ぱとかー","うー うー"],["🏍️","ばいく","ぶるるん"],["🚁","へりこぷたー","ばらばら"],["🚲","じてんしゃ","ちりん ちりん"],["🚢","ふね","ぼー"]],
"しぜん":[["🌧️","あめ","ざあ ざあ"],["⚡","かみなり","ごろ ごろ"],["🌬️","かぜ","びゅう びゅう"],["🌊","なみ","ざぶーん"],["💧","しずく","ぽた ぽた"],["🍃","はっぱ","かさ かさ"],["🔥","ひ","ぱち ぱち"],["🏞️","かわ","さら さら"]],
"おうち":[["⏰","とけい","ちく たく"],["🚪","どあ","ばたん"],["🔔","ちゃいむ","ぴん ぽーん"],["🚰","すいどう","じゃあ"],["✂️","はさみ","ちょき ちょき"],["🧹","そうじき","ぶおーん"],["📞","でんわ","りん りん"],["🍳","ふらいぱん","じゅう じゅう"]],
"がっき":[["🥁","たいこ","どん どん"],["🔔","すず","りん りん"],["🎹","ぴあの","ぽろん"],["🎸","ぎたー","じゃらん"],["🎺","らっぱ","ぱぱぱ"],["🪇","まらかす","しゃか しゃか"],["🪘","たいこ","とん とん"],["🎻","ばいおりん","きい きい"]]};
const $=id=>document.getElementById(id),categories=Object.keys(DATA);let cards=[],chosen=null,done=new Set(),lastSound="";const sel=$("category");categories.forEach(c=>{let o=document.createElement("option");o.value=c;o.textContent=c;sel.append(o)});
function speak(t){if(!("speechSynthesis" in window))return;window.speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang="ja-JP";u.rate=.82;window.speechSynthesis.speak(u)}
function shuffle(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function start(){done=new Set();chosen=null;lastSound="";$("message").textContent="";cards=shuffle(DATA[sel.value].flatMap((p,i)=>[{i,type:"picture",label:p[0]},{i,type:"word",label:p[1]}]));render()}
function render(){const board=$("board");board.replaceChildren();$("count").textContent=done.size+" / 8 くみ";cards.forEach((c,n)=>{const b=document.createElement("button");b.type="button";b.className="tile "+(c.type==="word"?"word ":"")+(done.has(c.i)?"done ":"")+(chosen===n?"selected":"");b.disabled=done.has(c.i);b.setAttribute("aria-label",(c.type==="picture"?"え ":"ことば ")+c.label);const span=document.createElement("span");span.className=c.type==="picture"?"emoji":"wordtext";span.textContent=done.has(c.i)?"✓":c.label;b.append(span);b.addEventListener("click",()=>choose(n));board.append(b)})}
function choose(n){const c=cards[n];if(done.has(c.i))return;if(chosen===n){chosen=null;render();return}if(chosen===null){chosen=n;render();return}const first=cards[chosen];chosen=null;if(first.i===c.i&&first.type!==c.type){done.add(c.i);lastSound=DATA[sel.value][c.i][2];$("message").textContent="せいかい！ "+lastSound;speak(lastSound);if(done.size===8){$("message").textContent="🎉 ぜんぶ できた！ はなまる！";}}else{$("message").textContent="もういちど ためしてね"}render()}
sel.addEventListener("change",start);$("again").addEventListener("click",start);$("replay").addEventListener("click",()=>{if(lastSound)speak(lastSound);else $("message").textContent="まず え と ことばを そろえてね"});start();
</script></body></html>
