<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>おととことば｜ことばたんけん</title><link rel="icon" type="image/svg+xml" href="./favicon.svg"><link rel="stylesheet" href="./celebration.css"><style>
*{box-sizing:border-box}body{margin:0;background:#285345;color:#254336;font-family:"Hiragino Maru Gothic ProN","Yu Gothic",sans-serif;font-weight:700}main{max-width:590px;margin:auto;padding:12px}a{color:inherit}.back{color:white;display:inline-block;padding:8px 0;text-decoration:none}h1{color:#fff9e8;text-align:center;margin:4px 0 10px;font-size:clamp(24px,6vw,32px)}.panel{background:#fffdf4;border-radius:22px;padding:14px;box-shadow:0 5px #1b3e32}.top{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}.top label{font-size:14px}select,button{font:inherit;touch-action:manipulation}select{padding:9px;border:2px solid #c9d9c6;border-radius:12px;max-width:100%;background:white;color:#254336}.stats{font-size:15px;color:#377b59}.instructions{text-align:center;margin:10px 0;font-size:15px}.board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px}.tile{aspect-ratio:1;min-height:64px;min-width:0;border:2px solid #cddfc8;border-bottom-width:5px;background:#eef6ff;border-radius:15px;color:#244737;display:grid;place-items:center;padding:4px;cursor:pointer}.tile.word{background:#fff2df;border-color:#ead4b6}.tile.covered{background:#4c927b;border-color:#2d6d59;color:#fff8dc}.tile.covered .backmark{font-size:clamp(28px,8vw,43px)}.tile.revealed{animation:turn .22s ease-out}@keyframes turn{from{transform:scaleX(.15)}to{transform:scaleX(1)}}.tile.selected{outline:4px solid #e9ad39;outline-offset:-3px;background:#fff1b8}.tile.done{background:#dcefe1;border-color:#9ecbab;opacity:.55}.tile .emoji{font-size:clamp(29px,8vw,45px);line-height:1}.tile .picture-art{width:clamp(40px,13vw,74px);max-width:100%;height:auto;display:block}.tile .wordtext{font-size:clamp(14px,4vw,21px);overflow-wrap:anywhere}.tile:focus-visible,button:focus-visible,select:focus-visible{outline:3px solid #d88d18;outline-offset:2px}.controls{display:flex;justify-content:center;gap:8px;margin:12px 0 0;flex-wrap:wrap}.controls button{border:0;border-radius:12px;padding:11px 15px;background:#dcefc9;color:#254336}.message{min-height:25px;text-align:center;margin:10px 0 0}.audio-status{margin:8px 0 0;text-align:center;font-size:14px}.audio-status:empty{display:none}.note{font-size:12px;line-height:1.65;color:#697e70;margin:12px 0 0}@media(max-width:380px){main{padding:7px}.panel{padding:9px}.board{gap:5px}.tile{border-radius:11px;min-height:60px}.tile .wordtext{font-size:14px}}@media(orientation:landscape){main{max-width:650px}.tile{aspect-ratio:1.4}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}#scoreStars{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}#scoreStars[hidden]{display:none}main{position:relative}@media(max-width:600px){body.show-score-stars{padding-top:26px}}
</style></head><body><canvas id="scoreStars" hidden aria-hidden="true"></canvas><main><a class="back" href="./#tanken-list">← ことばたんけん に もどる</a><h1>🔊 おととことば</h1><section class="panel"><div class="top"><label>しゅるいを えらぼう <select id="category"></select></label><span class="stats" id="count">0 / 8 くみ</span></div><p class="instructions">うらがえしの かーどを 2まい めくろう</p><div class="board" id="board" aria-label="えとことばのカード16まい"></div><p class="message" id="message" role="status" aria-live="polite"></p><div class="controls"><button id="replay">🔊 もういちど きく</button><button id="again">🔄 もういちど</button></div><p id="audioStatus" class="audio-status" role="status"></p>
<p class="note">カードを めくると、その おとが なります。</p>
<details class="note"><summary>音源の出典・クレジット</summary>
<p>原田英語「英語の先生の玉手箱」の配布音源を使用しています。<a href="https://github.com/kagoya/kotobagame/blob/main/assets/sounds/CREDITS.md">録音者・出典・ライセンスの一覧</a></p>
</details></section></main><script id="scoreStarsScript" src="./score-stars.js" defer></script><script src="./celebration.js" defer></script><script>
const scoreKey="hiragana-games-total-score-v1";
let queueScoreStars=()=>{};
document.getElementById("scoreStarsScript").addEventListener("load",()=>{
  if(typeof window.createScoreStars!=="function")return;
  queueScoreStars=window.createScoreStars(document.getElementById("scoreStars"),()=>{
    try {
      const score=Number(localStorage.getItem(scoreKey));
      return Number.isSafeInteger(score)&&score>=0?score:0;
    } catch {return 0}
  });
});
window.addEventListener("storage",event=>{if(event.key===scoreKey)queueScoreStars()});
const DATA={
"どうぶつ":[["🐶","いぬ","わん わん","dog.mp3"],["🐱","ねこ","にゃあ にゃあ","cat.mp3"],["🐮","うし","もー","cow.mp3"],["🐸","かえる","けろ けろ","frog.mp3"],["🐔","にわとり","こけこっこー","rooster.mp3"],["🐦","とり","ちゅん ちゅん","bird.mp3"],["🐴","うま","ひひーん","horse.mp3"],["🐑","ひつじ","めえ めえ","sheep.mp3"]],
"のりもの":[["🚂","きしゃ","しゅっ しゅっ","steam-train.mp3"],["🚗","くるま","ぶーん","car.mp3"],["🚑","きゅうきゅうしゃ","ぴーぽー","ambulance.mp3"],["🚓","ぱとかー","うー うー","police-car.mp3"],["🏍️","ばいく","ぶるるん","motorcycle.mp3"],["🚁","へりこぷたー","ばらばら","helicopter.mp3"],["🚲","じてんしゃ","ちりん ちりん","bicycle.mp3"],["🚢","ふね","ぼー","ship.mp3"]],
"しぜん":[["🌧️","あめ","ざあ ざあ","rain.mp3"],["⚡","かみなり","どかーん","thunder.mp3"],["🌬️","かぜ","びゅう びゅう","wind.mp3"],["🌊","なみ","ざぶーん","waves.mp3"],["💧","しずく","ぽちゃん","water-drop.mp3"],["🍃","はっぱ","かさ かさ","leaves.mp3"],["🔥","ひ","ぱち ぱち","fire.mp3"],["かわ","かわ","さら さら","stream.mp3"]],
"おうち":[["⏰","とけい","ちく たく","clock.mp3"],["🚪","どあ","ぎい","door.mp3"],["🔔","ちゃいむ","ぴん ぽーん","doorbell.mp3"],["🚰","すいどう","じゃあ","tap.mp3"],["✂️","はさみ","ちょき ちょき","scissors.mp3"],["そうじき","そうじき","ぶおーん","vacuum.mp3"],["📱","でんわ","りん りん","phone.mp3"],["🍳","ふらいぱん","じゅう じゅう","frying.mp3"]],
"がっき":[["🥁","たいこ","どん どん","taiko.mp3"],["🔔","すず","しゃん しゃん","bells.mp3"],["🎹","ぴあの","ぽろん","piano.mp3"],["🎸","ぎたー","じゃらん","guitar.mp3"],["🎺","らっぱ","ぱぱぱ","trumpet.mp3"],["🪇","まらかす","しゃか しゃか","maracas.mp3"],["🪘","ぼんご","とん とん","bongo.mp3"],["🎻","ばいおりん","きい きい","violin.mp3"]]};
const CELEBRATION_EMOJIS=[...new Set(Object.values(DATA).flatMap(
  entries=>entries.map(([picture])=>picture).filter(picture=>/\p{Extended_Pictographic}/u.test(picture))
))];
const PICTURES={
  "vacuum.mp3":'<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80"><path d="M47 49c2-17 16-19 16-33 0-8-7-10-13-6l-4 4" fill="none" stroke="#37485a" stroke-width="6" stroke-linecap="round"/><path d="M48 12 24 60" stroke="#718391" stroke-width="6" stroke-linecap="round"/><path d="M24 58 11 61 7 69h26l-3-9z" fill="#37485a"/><path d="M43 61c0-10 6-17 15-17h6c8 0 11 7 11 15v8H43z" fill="#d64e49" stroke="#883738" stroke-width="3"/><circle cx="63" cy="66" r="8" fill="#37485a"/><circle cx="63" cy="66" r="3" fill="#b4c5d0"/><path d="M48 54h8" stroke="#ffb08b" stroke-width="3" stroke-linecap="round"/></svg>',
  "stream.mp3":'<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80"><rect x="3" y="6" width="74" height="68" rx="12" fill="#b7e3a7"/><path d="M31 6h18c-12 13 22 18 17 35-3 12-29 10-23 33H17c-3-22 24-26 27-36C47 27 21 23 31 6z" fill="#268ac9"/><path d="M38 13c-1 10 21 14 18 25-4 12-24 13-26 28" fill="none" stroke="#b0edff" stroke-width="3" stroke-linecap="round"/><path d="m11 26 3-6 4 6m48 29 3-6 4 6m-65 3 4-7 4 7" fill="none" stroke="#569653" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>'
};
const $=id=>document.getElementById(id),categories=Object.keys(DATA);let cards=[],chosen=null,done=new Set(),lastSound="",locked=false,wrongTimer=null;const sel=$("category");categories.forEach(c=>{let o=document.createElement("option");o.value=c;o.textContent=c;sel.append(o)});
let currentAudio = null, lastPlayedIndex = null;

function stopEffect() {
  if (currentAudio) currentAudio.pause();
  currentAudio = null;
  $("audioStatus").textContent = "";
}

async function playEffect(i) {
  stopEffect();
  lastPlayedIndex = i;
  const [, , , filename] = DATA[sel.value][i];
  if (!filename) {
    $("audioStatus").textContent = "この おとは まだ ありません";
    return;
  }
  const audio = new Audio("./assets/sounds/" + filename);
  currentAudio = audio;
  try {
    await audio.play();
  } catch {
    if (currentAudio === audio) $("audioStatus").textContent = "おとを さいせいできませんでした";
  }
}
function shuffle(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function start(){$("celebrationOverlay")?.remove();stopEffect();lastPlayedIndex=null;if(wrongTimer)clearTimeout(wrongTimer);wrongTimer=null;locked=false;done=new Set();chosen=null;lastSound="";$("message").textContent="";cards=shuffle(DATA[sel.value].flatMap((p,i)=>[{i,type:"picture",label:p[0],art:PICTURES[p[3]]},{i,type:"word",label:p[1]}]));buildBoard();render()}
function buildBoard(){
  const board=$("board");
  board.replaceChildren(...cards.map((_,n)=>{
    const button=document.createElement("button");
    button.type="button";
    button.append(document.createElement("span"));
    button.addEventListener("click",()=>choose(n));
    return button;
  }));
}
function render(){
  const buttons=$("board").children;
  $("count").textContent=done.size+" / 8 くみ";
  cards.forEach((card,n)=>{
    const matched=done.has(card.i);
    const visible=matched||chosen===n||(locked&&secondChoice===n);
    const button=buttons[n];
    button.classList.add("tile");
    button.classList.toggle("word",visible&&card.type==="word");
    button.classList.toggle("revealed",visible);
    button.classList.toggle("covered",!visible);
    button.classList.toggle("done",matched);
    button.classList.toggle("selected",chosen===n);
    button.disabled=matched||locked;
    const label=(card.type==="picture"?"え ":"ことば ")+card.label;
    button.setAttribute("aria-label",matched?"そろった "+label:visible?label:"うらがえしのカード "+(n+1));
    button.setAttribute("aria-pressed",String(visible));
    const face=button.firstElementChild;
    face.className=visible?(card.type==="picture"?"emoji":"wordtext"):"backmark";
    if(visible&&card.art){
      if(!face.firstElementChild){
        const image=document.createElement("img");
        image.className="picture-art";
        image.alt="";
        image.src="data:image/svg+xml,"+encodeURIComponent(card.art);
        face.replaceChildren(image);
      }
    }else{
      const text=visible?card.label:"？";
      if(face.textContent!==text)face.textContent=text;
    }
  });
}
let secondChoice=null;
function choose(n){if(locked)return;const c=cards[n];if(done.has(c.i))return;playEffect(c.i);if(chosen===n){return}if(chosen===null){chosen=n;$("message").textContent="もう いちまい めくってね";render();return}const first=cards[chosen];secondChoice=n;locked=true;render();if(first.i===c.i&&first.type!==c.type){$("message").textContent="せいかい！ "+DATA[sel.value][c.i][2];lastSound=DATA[sel.value][c.i][2];wrongTimer=setTimeout(()=>{done.add(c.i);chosen=null;secondChoice=null;locked=false;wrongTimer=null;render();if(done.size===8){
  $("message").textContent="🎉 ぜんぶ できた！ はなまる！";
  window.showCelebration?.(shuffle([...CELEBRATION_EMOJIS]));
}},650)}else{$("message").textContent="ちがったね。もういちど！";wrongTimer=setTimeout(()=>{chosen=null;secondChoice=null;locked=false;wrongTimer=null;render();$("message").textContent="つぎの かーどを めくろう"},1100)}}
sel.addEventListener("change",start);$("again").addEventListener("click",start);$("replay").addEventListener("click",()=>{if(lastPlayedIndex!==null)playEffect(lastPlayedIndex);else $("message").textContent="まず え と ことばを そろえてね"});start();
</script></body></html>
