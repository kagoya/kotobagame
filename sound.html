<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>おととことば｜ことばたんけん</title><style>
*{box-sizing:border-box}body{margin:0;background:#285345;color:#254336;font-family:"Hiragino Maru Gothic ProN","Yu Gothic",sans-serif;font-weight:700}main{max-width:590px;margin:auto;padding:12px}a{color:inherit}.back{color:white;display:inline-block;padding:8px 0;text-decoration:none}h1{color:#fff9e8;text-align:center;margin:4px 0 10px;font-size:clamp(24px,6vw,32px)}.panel{background:#fffdf4;border-radius:22px;padding:14px;box-shadow:0 5px #1b3e32}.top{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}.top label{font-size:14px}select,button{font:inherit;touch-action:manipulation}select{padding:9px;border:2px solid #c9d9c6;border-radius:12px;max-width:100%;background:white;color:#254336}.stats{font-size:15px;color:#377b59}.instructions{text-align:center;margin:10px 0;font-size:15px}.board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px}.tile{aspect-ratio:1;min-height:64px;min-width:0;border:2px solid #cddfc8;border-bottom-width:5px;background:#eef6ff;border-radius:15px;color:#244737;display:grid;place-items:center;padding:4px;cursor:pointer}.tile.word{background:#fff2df;border-color:#ead4b6}.tile.covered{background:#4c927b;border-color:#2d6d59;color:#fff8dc}.tile.covered .backmark{font-size:clamp(28px,8vw,43px)}.tile.revealed{animation:turn .22s ease-out}@keyframes turn{from{transform:scaleX(.15)}to{transform:scaleX(1)}}.tile.selected{outline:4px solid #e9ad39;outline-offset:-3px;background:#fff1b8}.tile.done{background:#dcefe1;border-color:#9ecbab;opacity:.55}.tile .emoji{font-size:clamp(29px,8vw,45px);line-height:1}.tile .wordtext{font-size:clamp(14px,4vw,21px);overflow-wrap:anywhere}.tile:focus-visible,button:focus-visible,select:focus-visible{outline:3px solid #d88d18;outline-offset:2px}.controls{display:flex;justify-content:center;gap:8px;margin:12px 0 0;flex-wrap:wrap}.controls button{border:0;border-radius:12px;padding:11px 15px;background:#dcefc9;color:#254336}.message{min-height:25px;text-align:center;margin:10px 0 0}.note{font-size:12px;line-height:1.65;color:#697e70;margin:12px 0 0}@media(max-width:380px){main{padding:7px}.panel{padding:9px}.board{gap:5px}.tile{border-radius:11px;min-height:60px}.tile .wordtext{font-size:14px}}@media(orientation:landscape){main{max-width:650px}.tile{aspect-ratio:1.4}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style></head><body><main><a class="back" href="./#tanken-list">← ことばたんけん に もどる</a><h1>🔊 おととことば</h1><section class="panel"><div class="top"><label>しゅるいを えらぼう <select id="category"></select></label><span class="stats" id="count">0 / 8 くみ</span></div><p class="instructions">うらがえしの かーどを 2まい めくろう</p><div class="board" id="board" aria-label="えとことばのカード16まい"></div><p class="message" id="message" role="status" aria-live="polite"></p><div class="controls"><button id="replay">🔊 もういちど きく</button><button id="again">🔄 もういちど</button></div><p class="note">カードがそろうと、関連する音の言葉を読み上げます。実際の録音音源をWikimedia Commonsから探して再生します。音源が見つからない場合は、その旨を表示します。端末の音量を確認してください。</p><details class="note"><summary>音源の出典・クレジット</summary><div id="credits">音源を読み込むと、出典とライセンスが表示されます。</div></details></section></main><script>
const DATA={
"どうぶつ":[["🐶","いぬ","わん わん"],["🐱","ねこ","にゃあ にゃあ"],["🐮","うし","もー"],["🐸","かえる","けろ けろ"],["🐔","にわとり","こけこっこー"],["🐦","とり","ちゅん ちゅん"],["🐴","うま","ひひーん"],["🐑","ひつじ","めえ めえ"]],
"のりもの":[["🚂","きしゃ","しゅっ しゅっ"],["🚗","くるま","ぶーん"],["🚑","きゅうきゅうしゃ","ぴーぽー"],["🚓","ぱとかー","うー うー"],["🏍️","ばいく","ぶるるん"],["🚁","へりこぷたー","ばらばら"],["🚲","じてんしゃ","ちりん ちりん"],["🚢","ふね","ぼー"]],
"しぜん":[["🌧️","あめ","ざあ ざあ"],["⚡","かみなり","ごろ ごろ"],["🌬️","かぜ","びゅう びゅう"],["🌊","なみ","ざぶーん"],["💧","しずく","ぽた ぽた"],["🍃","はっぱ","かさ かさ"],["🔥","ひ","ぱち ぱち"],["🏞️","かわ","さら さら"]],
"おうち":[["⏰","とけい","ちく たく"],["🚪","どあ","ばたん"],["🔔","ちゃいむ","ぴん ぽーん"],["🚰","すいどう","じゃあ"],["✂️","はさみ","ちょき ちょき"],["🧹","そうじき","ぶおーん"],["📞","でんわ","りん りん"],["🍳","ふらいぱん","じゅう じゅう"]],
"がっき":[["🥁","たいこ","どん どん"],["🔔","すず","りん りん"],["🎹","ぴあの","ぽろん"],["🎸","ぎたー","じゃらん"],["🎺","らっぱ","ぱぱぱ"],["🪇","まらかす","しゃか しゃか"],["🪘","たいこ","とん とん"],["🎻","ばいおりん","きい きい"]]};
const $=id=>document.getElementById(id),categories=Object.keys(DATA);let cards=[],chosen=null,done=new Set(),lastSound="",locked=false,wrongTimer=null;const sel=$("category");categories.forEach(c=>{let o=document.createElement("option");o.value=c;o.textContent=c;sel.append(o)});
// Only genuine recordings with Commons metadata permitting attribution-based reuse.
const SOUND_SEARCH={
"どうぶつ":["dog barking","cat meowing","cow mooing","frog croaking","rooster crowing","sparrow chirping","horse neighing","sheep bleating"],
"のりもの":["steam train whistle","car engine starting","ambulance siren","police siren","motorcycle engine","helicopter sound","bicycle bell","ship horn"],
"しぜん":["rain falling","thunder sound","wind blowing","ocean waves","water dripping","leaves rustling","fire crackling","river flowing"],
"おうち":["clock ticking","door closing","doorbell ringing","running tap water","scissors cutting","vacuum cleaner","telephone ringing","frying sizzling"],
"がっき":["drum beat","bell ringing","piano notes","acoustic guitar strumming","trumpet playing","maracas shaking","hand drum playing","violin playing"]};
let currentAudio=null,lastPlayedIndex=null,audioToken=0;
const audioCache=new Map(),pending=new Map();
const commonsApi="https://commons.wikimedia.org/w/api.php";
function plain(t){const d=document.createElement("div");d.innerHTML=t||"";return d.textContent.trim()}
function licenseOK(info){const m=info.extmetadata||{};const name=plain(m.LicenseShortName?.value||"").toLowerCase();const usage=plain(m.UsageTerms?.value||"").toLowerCase();return /^(cc0|cc by 2\.0|cc by 2\.5|cc by 3\.0|cc by 4\.0|public domain|pd)/.test(name)||/creative commons attribution(?!-sharealike)|public domain|cc0/.test(usage)}
async function lookupSound(category,i){const key=category+":"+i;if(audioCache.has(key))return audioCache.get(key);if(pending.has(key))return pending.get(key);const promise=(async()=>{const query=SOUND_SEARCH[category][i]+" filetype:audio";const params=new URLSearchParams({action:"query",generator:"search",gsrsearch:query,gsrnamespace:"6",gsrlimit:"12",prop:"imageinfo",iiprop:"url|extmetadata|mime",format:"json",origin:"*"});const res=await fetch(commonsApi+"?"+params);if(!res.ok)throw Error("Commons API "+res.status);const data=await res.json();const files=Object.values(data.query?.pages||{}).filter(p=>p.imageinfo?.[0]).sort((a,b)=>(a.index||0)-(b.index||0));for(const p of files){const info=p.imageinfo[0],m=info.extmetadata||{};if(!licenseOK(info)||!/^audio\//.test(info.mime||""))continue;const url=info.url;if(!/\.(ogg|oga|mp3|wav|flac|opus)(\?|$)/i.test(url))continue;const result={url,title:p.title,author:plain(m.Artist?.value)||"作者情報は出典を参照",license:plain(m.LicenseShortName?.value)||"Commons",page:info.descriptionurl,licenseUrl:m.LicenseUrl?.value||""};audioCache.set(key,result);showCredits();return result}audioCache.set(key,null);return null})();pending.set(key,promise);try{return await promise}finally{pending.delete(key)}}
function showCredits(){const target=$("credits");target.replaceChildren();for(const [key,item] of audioCache){if(!item)continue;const p=document.createElement("p");const a=document.createElement("a");a.href=item.page;a.target="_blank";a.rel="noopener";a.textContent=key+"： "+item.title;const l=document.createElement("a");l.href=item.licenseUrl||item.page;l.target="_blank";l.rel="noopener";l.textContent=item.license;p.append(a,document.createTextNode(" ／ "+item.author+" ／ "),l);target.append(p)}if(!target.childNodes.length)target.textContent="使用できる音源はまだ確認されていません。"}
async function playEffect(i){const category=sel.value,token=++audioToken;lastPlayedIndex=i;if(currentAudio){currentAudio.pause();currentAudio=null}try{const item=await lookupSound(category,i);if(token!==audioToken||category!==sel.value)return;if(!item){$("message").textContent="この おとは まだ みつかっていません";return}const audio=new Audio(item.url);audio.preload="auto";currentAudio=audio;await audio.play()}catch(e){if(token===audioToken)$("message").textContent="おとを さいせいできませんでした";console.warn("Commons recording playback",e)}}
function shuffle(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function start(){++audioToken;if(currentAudio){currentAudio.pause();currentAudio=null}lastPlayedIndex=null;if(wrongTimer)clearTimeout(wrongTimer);wrongTimer=null;locked=false;done=new Set();chosen=null;lastSound="";$("message").textContent="";cards=shuffle(DATA[sel.value].flatMap((p,i)=>[{i,type:"picture",label:p[0]},{i,type:"word",label:p[1]}]));render()}
function render(){const board=$("board");board.replaceChildren();$("count").textContent=done.size+" / 8 くみ";cards.forEach((c,n)=>{const visible=done.has(c.i)||chosen===n||locked&&secondChoice===n;const b=document.createElement("button");b.type="button";b.className="tile "+(visible?(c.type==="word"?"word ":"")+"revealed ":"covered ")+(done.has(c.i)?"done ":"")+(chosen===n?"selected":"");b.disabled=done.has(c.i)||locked;b.setAttribute("aria-label",done.has(c.i)?"そろったカード":visible?(c.type==="picture"?"え ":"ことば ")+c.label:"うらがえしのカード "+(n+1));b.setAttribute("aria-pressed",visible?"true":"false");const span=document.createElement("span");span.className=visible?(c.type==="picture"?"emoji":"wordtext"):"backmark";span.textContent=done.has(c.i)?"✓":visible?c.label:"？";b.append(span);b.addEventListener("click",()=>choose(n));board.append(b)})}
let secondChoice=null;
function choose(n){if(locked)return;const c=cards[n];if(done.has(c.i))return;playEffect(c.i);if(chosen===n){return}if(chosen===null){chosen=n;$("message").textContent="もう いちまい めくってね";render();return}const first=cards[chosen];secondChoice=n;locked=true;render();if(first.i===c.i&&first.type!==c.type){$("message").textContent="せいかい！ "+DATA[sel.value][c.i][2];lastSound=DATA[sel.value][c.i][2];wrongTimer=setTimeout(()=>{done.add(c.i);chosen=null;secondChoice=null;locked=false;wrongTimer=null;render();if(done.size===8)$("message").textContent="🎉 ぜんぶ できた！ はなまる！"},650)}else{$("message").textContent="ちがったね。もういちど！";wrongTimer=setTimeout(()=>{chosen=null;secondChoice=null;locked=false;wrongTimer=null;render();$("message").textContent="つぎの かーどを めくろう"},1100)}}
sel.addEventListener("change",start);$("again").addEventListener("click",start);$("replay").addEventListener("click",()=>{if(lastPlayedIndex!==null)playEffect(lastPlayedIndex);else $("message").textContent="まず え と ことばを そろえてね"});start();
</script></body></html>
